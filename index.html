<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121815">
<title>タワーローグ 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261018192035">
</head>
<body>

<!-- スタート画面：上にスワイプ（＝ページを下へ読み進める）で Safari のアドレスバーを細くしてから始める -->
<section id="start">
  <div class="start-inner">
    <p class="eyebrow">段階1 戦闘の試作</p>
    <h1>タワーローグ<span>（仮）</span></h1>
    <canvas id="title-art" width="112" height="40" aria-hidden="true"></canvas>
    <div class="swipe">
      <div class="arrow" aria-hidden="true">▲<br>▲</div>
      <p>上にスワイプしてスタート</p>
      <button type="button" id="pc-start" class="pc-only">クリックでスタート</button>
    </div>
  </div>
</section>

<!-- ゲーム画面 -->
<main id="game" hidden>
  <header class="hud">
    <span class="hud-life" title="ライフ">♥ <b id="h-life">20</b></span>
    <span class="hud-turn"><b id="h-phase">準備</b> <span id="h-turn">1/5</span> <span id="h-left" class="hud-left"></span></span>
    <span class="hud-gold" title="お金">● <b id="h-gold">20</b></span>
  </header>

  <div class="stage" id="stage">
    <canvas id="map"></canvas>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="bubble" id="gate-info" hidden></div>
  </div>


  <div class="actions">
    <button type="button" id="btn-draw">ドロー <small>● <span id="draw-cost">15</span></small></button>
    <button type="button" id="btn-speed" aria-pressed="false">×1</button>
    <button type="button" id="btn-go" class="go">攻撃開始</button>
  </div>

  <div class="hand-bar">
    <span class="energy" title="エネルギー"><span class="en-label">エネルギー</span><span id="h-energy"></span></span>
    <span class="piles"><button type="button" class="pile-btn" id="btn-pile-draw" aria-label="山札の内訳"><svg class="pile-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1.5" width="9" height="12" rx="1.5"/><rect x="2" y="3.5" width="9" height="12" rx="1.5"/></svg>山札 <b id="h-draw">0</b></button><button type="button" class="pile-btn disc" id="btn-pile-disc" aria-label="捨て札の内訳"><svg class="pile-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1.5" width="9" height="12" rx="1.5"/><rect x="2" y="3.5" width="9" height="12" rx="1.5"/></svg>捨て札 <b id="h-disc">0</b></button></span>
  </div>
  <div class="hand" id="hand"></div>

  <!-- タワーをタップした時の小窓 -->
  <div class="sheet" id="tower-sheet" hidden>
    <div class="sheet-head"><b id="ts-name"></b> <span id="ts-lv"></span></div>
    <div id="ts-stats" class="stat-table"></div>
    <button type="button" id="ts-up" class="up">強化</button>
  </div>
</main>

<!-- カードの詳細（長押し） -->
<div class="modal" id="detail" hidden>
  <div class="modal-box">
    <canvas id="detail-art" width="34" height="36"></canvas>
    <h2 id="d-name"></h2>
    <p id="d-text"></p>
    <dl id="d-stats"></dl>
    <button type="button" id="d-close">閉じる</button>
  </div>
</div>

<!-- 山札・捨て札の内訳 -->
<div class="modal" id="pile" hidden>
  <div class="modal-box">
    <h2 id="p-title"></h2>
    <ul class="pile-list" id="p-list"></ul>
    <p id="p-note"></p>
    <button type="button" id="p-close">閉じる</button>
  </div>
</div>

<!-- 勝ち・負け -->
<div class="modal" id="result" hidden>
  <div class="modal-box">
    <h2 id="r-title"></h2>
    <p id="r-text"></p>
    <button type="button" id="r-again" class="go">もう一度</button>
  </div>
</div>

<div id="rotate"><p>画面を縦にしてください</p></div>

<script src="js/data.js?v=20261018192035"></script>
<script src="js/battle.js?v=20261018192035"></script>
<script src="js/sprites.js?v=20261018192035"></script>
<script src="js/render.js?v=20261018192035"></script>
<script src="js/ui.js?v=20261018192035"></script>
</body>
</html>
