<title>疑似3D 比較台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--bg:#0f1713;--panel:#18241d;--fg:#eef3e8;--mute:#9db0a2;--line:#2c3f33;--acc:#ffb347;--on:#1a1206;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "M PLUS Rounded 1c",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:19px;margin:4px 0 2px;font-weight:800;text-wrap:balance}
.lead{margin:0 0 10px;color:var(--mute);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button{font:inherit;font-weight:500;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;min-height:38px;cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:800}
.tabs button{flex:1 1 30%;text-align:left;line-height:1.3;padding:8px 10px}
.tabs small{display:block;font-weight:500;font-size:11px;opacity:.85}
.lbl{font-size:11px;color:var(--mute);letter-spacing:.08em;margin:8px 0 0}
.band{width:min(100vw,520px);margin:8px 0 8px calc(50% - min(50vw,260px));background:#0a0f0c;overflow:hidden;display:flex;justify-content:center}
.band canvas{display:block;image-rendering:pixelated;touch-action:manipulation}
.band canvas.smooth{image-rendering:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 8px}
.stat b{display:block;font-size:16px;font-weight:800}.stat span{font-size:10.5px;color:var(--mute)}
.info{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:8px 0;font-size:12.5px}
.info b{color:var(--acc)}
.note{font-size:12px;color:var(--mute);margin:4px 0}
[hidden]{display:none!important}
</style>
<div class="wrap">
<h1>疑似3D 比較台</h1>
<p class="lead">同じ戦闘（敵・塔・ダメージの数字）を3つの見た目で表示します。画面をタップすると塔を置けます。</p>
<div class="row tabs" id="g-view">
<button type="button" data-view="A" aria-pressed="true">① ドット拡大<small>元のゲームと同じ幅</small></button>
<button type="button" data-view="B" aria-pressed="false">② ドット等倍<small>マップを広く</small></button>
<button type="button" data-view="C" aria-pressed="false">③ アイソメ<small>v2風・図形</small></button>
</div>
<div class="band"><canvas id="cvA"></canvas><canvas id="cvB" hidden></canvas><canvas id="cvC" hidden></canvas></div>
<div class="info" id="info"></div>
<div class="stats"><div class="stat"><b id="sEn">0</b><span>敵の数</span></div><div class="stat"><b id="sLife">20</b><span>ライフ</span></div><div class="stat"><b id="sFps">0</b><span>fps</span></div><div class="stat"><b id="sMs">0</b><span>描画 ms/枚</span></div></div>
<div class="lbl">置く塔</div>
<div class="row" id="g-tool"><button type="button" data-tool="archer" aria-pressed="false">弓</button><button type="button" data-tool="fire" aria-pressed="true">炎</button><button type="button" data-tool="thunder" aria-pressed="false">雷</button><button type="button" data-tool="frost" aria-pressed="false">氷</button><button type="button" data-tool="remove" aria-pressed="false">撤去</button></div>
<div class="lbl">敵の数（負荷テスト）</div>
<div class="row" id="g-stress"><button type="button" data-stress="0" aria-pressed="true">ふつう</button><button type="button" data-stress="50" aria-pressed="false">50体</button><button type="button" data-stress="200" aria-pressed="false">200体</button><button type="button" data-stress="400" aria-pressed="false">400体</button></div>
<div class="lbl">速さ・表示</div>
<div class="row"><span class="row" id="g-speed" style="margin:0"><button type="button" data-speed="1" aria-pressed="true">×1</button><button type="button" data-speed="2" aria-pressed="false">×2</button><button type="button" data-speed="3" aria-pressed="false">×3</button></span><button type="button" id="bPause" aria-pressed="false">⏸ 停止</button><button type="button" id="bRange" aria-pressed="false">射程</button><button type="button" id="bReset" aria-pressed="false">塔を戻す</button></div>
<div class="lbl">見る角度</div>
<div class="row" id="g-pitch"><button type="button" data-pitch="36" aria-pressed="false">浅い 36°</button><button type="button" data-pitch="48" aria-pressed="true">ふつう 48°</button><button type="button" data-pitch="58" aria-pressed="false">深い 58°</button></div>
<div class="lbl">道の暗いドット（①②のみ）</div>
<div class="row" id="g-road"><button type="button" data-road="0" aria-pressed="false">少ない（今）</button><button type="button" data-road="1" aria-pressed="true">中間</button><button type="button" data-road="2" aria-pressed="false">多い（前）</button></div>
<div class="row" id="g-tilt" hidden><button type="button" data-tilt="0.5" aria-pressed="true">菱形 2:1</button><button type="button" data-tilt="0.667" aria-pressed="false">菱形 3:2（縦に長く）</button></div>
<p class="note">ドット②は、広いマップ（マスの数が多い）です。①③は元のマップ（11×15）です。②のマスは元のゲームより小さくなるので、指でのタップのしやすさも見比べてください。</p>
</div>
<script>
/* ============ 共通：戦闘の中身（3つの見え方で同じものを使う） ============ */
var TW = 24;   // ドット版の1マスの横ドット数（高さや飛ぶ高さは、この大きさを基準にした「ドット数」で持つ）
function hash(x, y) {
  var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
/* 数値は元のゲーム（js/data.js）と同じ。mz は弾の出る高さ */
var TT = {
  archer:  { name: '弓', range: 2.6, dmg: 6,  rate: 0.8, speed: 9,  kind: 'arrow', mz: 28 },
  fire:    { name: '炎', range: 2.3, dmg: 7,  rate: 1.3, speed: 6,  kind: 'flame', splash: 0.65, burn: { dps: 10, dur: 2 }, mz: 24 },
  thunder: { name: '雷', range: 2.4, dmg: 10, rate: 1.5, speed: 16, kind: 'bolt', chain: 2, mz: 36 },
  frost:   { name: '氷', range: 2.2, dmg: 4,  rate: 1.2, speed: 6,  kind: 'ice', slow: { pct: 0.4, dur: 1.5 }, mz: 26 }
};
var ET = {
  slime:  { hp: 48,  sp: 0.9,  ar: 0,   mr: 0, h: 11, sr: 6, gap: 1.2 },
  goblin: { hp: 35,  sp: 1.6,  ar: 0,   mr: 0, h: 15, sr: 5, gap: 0.9 },
  wolf:   { hp: 28,  sp: 2.1,  ar: 0,   mr: 0, h: 12, sr: 8, gap: 0.7 },
  orc:    { hp: 190, sp: 0.6,  ar: 0.4, mr: 0, h: 21, sr: 8, gap: 2.6 },
  bat:    { hp: 20,  sp: 0.95, ar: 0,   mr: 0, h: 12, sr: 5, gap: 0.5, fly: true, alt: 16 }
};
var WAVES = [['slime', 6, 1.2], ['goblin', 6, 0.9], ['wolf', 4, 0.7], ['bat', 4, 0.6], ['orc', 2, 2.6], ['slime', 4, 1.0], ['goblin', 5, 0.8], ['orc', 3, 2.2]];

/* ---------- ステージ ---------- */
function isRoadCh(ch) { return ch === '#' || ch === 'A' || ch === 'B' || ch === 'C' || ch === 'G'; }
function stageCh(st, tx, ty) { return (tx < 0 || ty < 0 || tx >= st.cols || ty >= st.rowsN) ? '.' : st.rows[ty][tx]; }

function makeStageOrig() {   // 元のゲームの「草原の分かれ道」（11×15）
  var rows = [
    '..A.....B..', 'T.#.....#.T', '..#.....#..', '.T#.....#T.', '..#######..',
    '.....#.....', '.....#.....', '..####..T..', '.T#......R.', '..#........',
    '..#.......T', '..#######..', '.T......#..', '....T..X#X.', '.......XGX.'
  ];
  return {
    id: 'orig', name: '草原の分かれ道', cols: 11, rowsN: 15, rows: rows, gates: ['A', 'B'],
    paths: {
      A: [[2.5,0.8],[2.5,4.5],[5.5,4.5],[5.5,7.5],[2.5,7.5],[2.5,11.5],[8.5,11.5],[8.5,14.6]],
      B: [[8.5,0.8],[8.5,4.5],[5.5,4.5],[5.5,7.5],[2.5,7.5],[2.5,11.5],[8.5,11.5],[8.5,14.6]]
    },
    castle: { x: 8.5, y: 15, tx: 8 }, fly: { x: 8.5, y: 14.2 },
    towers: [['fire', 4, 6], ['thunder', 6, 5], ['archer', 3, 5], ['frost', 3, 9], ['thunder', 7, 10], ['fire', 6, 10]]
  };
}
function makeStageWide(cols, rowsN) {   // 同じ作りで、マスの数を増やした広いマップ
  cols = Math.max(10, cols); rowsN = Math.max(16, rowsN);
  var g = [], x, y, i;
  for (y = 0; y < rowsN; y++) { g.push([]); for (x = 0; x < cols; x++) g[y].push('.'); }
  var mx = Math.floor(cols / 2), r1 = Math.round(rowsN * 0.2), r2 = Math.round(rowsN * 0.42), r3 = Math.round(rowsN * 0.65), r4 = Math.round(rowsN * 0.85);
  var tail = [[mx, r2], [3, r2], [3, r3], [cols - 4, r3], [cols - 4, r4], [mx, r4], [mx, rowsN - 1]];
  var G = { A: [[2, 0], [2, r1], [mx, r1]].concat(tail), B: [[cols - 3, 0], [cols - 3, r1], [mx, r1]].concat(tail) };
  var segs = {};
  Object.keys(G).forEach(function (k) {
    var P = G[k];
    for (i = 0; i < P.length - 1; i++) {
      var a = P[i], b = P[i + 1], dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]), cx = a[0], cy = a[1];
      g[cy][cx] = '#';
      while (cx !== b[0] || cy !== b[1]) { cx += dx; cy += dy; g[cy][cx] = '#'; }
      segs[a.join(',') + '-' + b.join(',')] = [a, b];
    }
  });
  g[0][2] = 'A'; g[0][cols - 3] = 'B';
  for (y = rowsN - 2; y < rowsN; y++) for (x = mx - 1; x <= mx + 1; x++) g[y][x] = 'X';
  g[rowsN - 1][mx] = 'G'; g[rowsN - 2][mx] = '#';
  var towers = [], types = ['fire', 'thunder', 'archer', 'frost'], ti = 0;
  Object.keys(segs).forEach(function (k) {
    var a = segs[k][0], b = segs[k][1], len = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
    if (len < 3 || towers.length >= 14) return;
    var mxp = Math.round((a[0] + b[0]) / 2), myp = Math.round((a[1] + b[1]) / 2), horiz = a[1] === b[1];
    var offs = horiz ? [[0, -1], [0, 1], [0, -2], [0, 2]] : [[-1, 0], [1, 0], [-2, 0], [2, 0]];
    for (var q = 0; q < offs.length; q++) {
      var tx = mxp + offs[q][0], ty = myp + offs[q][1];
      if (tx < 0 || ty < 1 || tx >= cols || ty >= rowsN || g[ty][tx] !== '.') continue;
      g[ty][tx] = 'o'; towers.push([types[ti++ % 4], tx, ty]); break;
    }
  });
  var seed = 77, h = seed;
  function rnd() { h = (h * 1103515245 + 12345) & 0x7fffffff; return h / 0x7fffffff; }
  for (y = 1; y < rowsN; y++) for (x = 0; x < cols; x++) {
    if (g[y][x] !== '.') continue;
    var r = rnd(); if (r < 0.085) g[y][x] = 'T'; else if (r < 0.11) g[y][x] = 'R';
  }
  var rows = g.map(function (row) { return row.join('').replace(/o/g, '.'); });
  var paths = {};
  Object.keys(G).forEach(function (k) { var P = G[k]; paths[k] = P.map(function (q, j) { return [q[0] + 0.5, j === 0 ? 0.8 : j === P.length - 1 ? rowsN - 0.4 : q[1] + 0.5]; }); });
  return { id: 'wide', name: '広い草原', cols: cols, rowsN: rowsN, rows: rows, gates: ['A', 'B'], paths: paths, castle: { x: mx + 0.5, y: rowsN, tx: mx }, fly: { x: mx + 0.5, y: rowsN - 0.8 }, towers: towers };
}

/* ---------- 戦闘の状態 ---------- */
function createSim(stage) {
  var S = { stage: stage, towers: [], enemies: [], shots: [], bolts: [], parts: [], rings: [], scorches: [], simT: 0, lives: 20, kills: 0, castleHit: 0, stressN: 0, wi: 0, wc: 0, wTimer: 1.5, gateFlip: 0, towerId: 0 };
  resetTowers(S); return S;
}
function resetTowers(S) { S.towers.length = 0; S.stage.towers.forEach(function (d) { placeTower(S, d[0], d[1], d[2], true); }); }
function placeTower(S, type, tx, ty, quiet) {
  var i;
  for (i = 0; i < S.towers.length; i++) if (S.towers[i].tx === tx && S.towers[i].ty === ty) S.towers.splice(i, 1);
  S.towers.push({ kind: 'tower', type: type, tx: tx, ty: ty, x: tx + 0.5, y: ty + 0.5, fy: ty + 0.7, cd: 0.2 + Math.random() * 0.5, flash: 0, id: ++S.towerId, show: quiet ? 0 : 1.6 });
  if (!quiet) for (i = 0; i < 8; i++) S.parts.push({ x: tx + 0.5, y: ty + 0.55, z: 2, vx: (Math.random() - 0.5) * 1.4, vy: (Math.random() - 0.3) * 0.8, vz: 20 + Math.random() * 30, g: 120, life: 0.5, max: 0.5, col: i & 1 ? '#c9b48a' : '#f0e8d0', sz: 2 });
}
function towerAt(S, tx, ty) { for (var i = 0; i < S.towers.length; i++) if (S.towers[i].tx === tx && S.towers[i].ty === ty) return S.towers[i]; return null; }
function removeTower(S, tx, ty) { for (var i = 0; i < S.towers.length; i++) if (S.towers[i].tx === tx && S.towers[i].ty === ty) { S.towers.splice(i, 1); return; } }

function spawnEnemy(S, type, gate, hpMul) {
  var T = ET[type], pth = S.stage.paths[gate];
  var e = { kind: 'enemy', type: type, T: T, gate: gate, hp: T.hp * hpMul, max: T.hp * hpMul, x: pth[0][0], y: pth[0][1], pi: 1, prog: 0, ph: Math.random() * 2, burn: 0, bdps: 0, slow: 0, spd: 1, shock: 0, face: 1, fy: 0, dead: false, seed: Math.random() };
  S.enemies.push(e);
}
function chestZ(e) { return e.T.h * 0.5 + (e.T.fly ? e.T.alt : 0); }
function hitEnemy(S, e, d, kindDmg) {
  if (e.dead) return;
  e.hp -= d * (1 - (kindDmg === 'physical' ? e.T.ar : e.T.mr));
  if (e.hp <= 0) {
    e.dead = true; S.kills++;
    for (var i = 0; i < 3; i++) S.parts.push({ x: e.x, y: e.y, z: 6, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.4, vz: 50 + Math.random() * 30, g: 160, life: 0.6, max: 0.6, col: '#ffd84a', sz: 2 });
  }
}
function spawnLogic(S, dt) {
  if (S.stressN > 0) {
    var n = 0, kinds = ['slime', 'goblin', 'wolf', 'orc', 'bat'];
    while (S.enemies.length < S.stressN && n < 10) { spawnEnemy(S, kinds[(Math.random() * 5) | 0], Math.random() < 0.5 ? 'A' : 'B', 40); n++; }
    return;
  }
  S.wTimer -= dt;
  if (S.wTimer <= 0) {
    var w = WAVES[S.wi]; spawnEnemy(S, w[0], (S.gateFlip++ & 1) ? 'A' : 'B', 1); S.wc++;
    if (S.wc >= w[1]) { S.wc = 0; S.wi = (S.wi + 1) % WAVES.length; S.wTimer = 4; } else S.wTimer = w[2];
  }
}
function setStress(S, n) { S.stressN = n; if (!n) { S.enemies.length = 0; S.wi = 0; S.wc = 0; S.wTimer = 1; } }

function findTarget(S, t, range) {
  var best = null, bp = -1, r2 = range * range;
  for (var i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i]; if (e.dead) continue;
    var dx = e.x - t.x, dy = e.y - t.y;
    if (dx * dx + dy * dy <= r2 && e.prog > bp) { best = e; bp = e.prog; }
  }
  return best;
}
function shoot(S, t, e) {
  var D = TT[t.type];
  t.flash = 0.2; t.cd = D.rate;
  if (D.kind === 'bolt') { doBolt(S, t, e); return; }
  var dx = e.x - t.x, dy = e.y - t.y, dist = Math.sqrt(dx * dx + dy * dy);
  S.shots.push({ D: D, k: D.kind, x0: t.x, y0: t.y, z0: D.mz, tgt: e, tx: e.x, ty: e.y, t: 0, dur: Math.max(0.12, dist / D.speed), arc: D.kind === 'flame' ? 14 : D.kind === 'ice' ? 8 : 3, cx: t.x, cy: t.y, cz: D.mz, dx: 1, dy: 0, dz: 0 });
}
function doBolt(S, t, e) {
  var D = TT.thunder, pts = [{ x: t.x, y: t.y, z: D.mz }], cur = e, used = [e], dmg = D.dmg, i, j;
  for (i = 0; i < 1 + D.chain && cur; i++) {
    pts.push({ x: cur.x, y: cur.y, z: chestZ(cur) }); hitEnemy(S, cur, dmg, 'magic'); cur.shock = 0.2; dmg *= 0.7;
    for (j = 0; j < 4; j++) S.parts.push({ x: cur.x, y: cur.y, z: 8, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 0.8, vz: 20 + Math.random() * 50, g: 200, life: 0.3, max: 0.3, col: j & 1 ? '#eaffff' : '#58d4ff', sz: 1 });
    var nx = null, bd = 1.7 * 1.7;
    for (j = 0; j < S.enemies.length; j++) {
      var q = S.enemies[j]; if (q.dead || used.indexOf(q) >= 0) continue;
      var dx = q.x - cur.x, dy = q.y - cur.y, d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; nx = q; }
    }
    if (nx) used.push(nx); cur = nx;
  }
  S.bolts.push({ pts: pts, t: 0, dur: 0.2 });
  S.rings.push({ x: t.x, y: t.y, t: 0, dur: 0.25, r: 0.6, col: '88,212,255' });
}
function impact(S, p) {
  var D = p.D, e = p.tgt, i;
  if (p.k === 'arrow') {
    if (e && !e.dead) hitEnemy(S, e, D.dmg, 'physical');
    for (i = 0; i < 2; i++) S.parts.push({ x: p.tx, y: p.ty, z: 6, vx: (Math.random() - 0.5), vy: (Math.random() - 0.5) * 0.5, vz: 30, g: 160, life: 0.25, max: 0.25, col: '#e8e0c0', sz: 1 });
  } else if (p.k === 'ice') {
    if (e && !e.dead) { hitEnemy(S, e, D.dmg, 'magic'); e.slow = D.slow.dur; e.spd = 1 - D.slow.pct; }
    for (i = 0; i < 6; i++) S.parts.push({ x: p.tx, y: p.ty, z: 6, vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 0.6, vz: 40 + Math.random() * 30, g: 180, life: 0.45, max: 0.45, col: i & 1 ? '#e0f8ff' : '#7cc4f0', sz: 2 });
    S.rings.push({ x: p.tx, y: p.ty, t: 0, dur: 0.3, r: 0.45, col: '160,224,255' });
  } else if (p.k === 'flame') {
    var r2 = D.splash * D.splash;
    for (i = 0; i < S.enemies.length; i++) {
      var q = S.enemies[i]; if (q.dead) continue;
      var dx = q.x - p.tx, dy = q.y - p.ty;
      if (dx * dx + dy * dy <= r2) { hitEnemy(S, q, D.dmg, 'magic'); q.burn = D.burn.dur; q.bdps = D.burn.dps; }
    }
    for (i = 0; i < 12 && S.parts.length < 900; i++) { var a = Math.random() * 6.28, sp = 0.5 + Math.random() * 1.2; S.parts.push({ x: p.tx, y: p.ty, z: 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, vz: 40 + Math.random() * 60, g: 170, life: 0.55, max: 0.55, col: i % 3 === 0 ? '#ffe27a' : i % 3 === 1 ? '#ff8a2a' : '#e0401a', sz: 2 }); }
    S.rings.push({ x: p.tx, y: p.ty, t: 0, dur: 0.35, r: D.splash, col: '255,150,50' });
    S.scorches.push({ x: p.tx, y: p.ty, t: 0, dur: 1.8 });
  }
}
function updateSim(S, dt) {
  var i, j, st = S.stage;
  S.simT += dt; spawnLogic(S, dt);
  for (i = 0; i < S.enemies.length; i++) {
    var e = S.enemies[i], T = e.T;
    if (e.burn > 0) { e.burn -= dt; hitEnemy(S, e, e.bdps * dt, 'magic'); }
    if (e.slow > 0) { e.slow -= dt; if (e.slow <= 0) e.spd = 1; }
    if (e.shock > 0) e.shock -= dt;
    if (e.dead) continue;
    var step = T.sp * e.spd * dt; e.ph += T.sp * e.spd * dt * 2.2;
    if (T.fly) {
      var fx = st.fly.x - e.x, fy = st.fly.y - e.y, d = Math.sqrt(fx * fx + fy * fy);
